name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install -r requirements-training.txt -r requirements-dev.txt
      - name: Check formatting
        run: python -m ruff format --check scripts tests
      - name: Lint
        run: python -m ruff check scripts tests
      - name: Test
        run: python -m unittest discover -s tests -v
